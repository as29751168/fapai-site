name: 每日更新法拍資料
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: 產生封面圖
        run: |
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          pip install playwright >/dev/null
          playwright install --with-deps chromium >/dev/null
          python og.py
      - run: python build.py
      - name: 有變動才提交
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet || (git commit -m "更新資料" && git push)
