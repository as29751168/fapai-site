name: 每日更新法拍資料
# 2026-11-10 GitHub 帳號恢復後重新註冊排程
on:
  schedule:
    - cron: "0 3 * * *"     # 台北時間 11:00
    - cron: "30 8 * * *"    # 台北時間 16:30（當天開標結果）
  workflow_dispatch:
concurrency:
  group: daily-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests >/dev/null
      - run: python scrape.py
      - name: 產生封面圖
        run: |
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          pip install playwright requests >/dev/null
          playwright install --with-deps chromium >/dev/null
          python og.py

      - run: python build.py
      - name: 有變動才提交
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet && exit 0
          git commit -m "更新資料"
          for n in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main; then git push && exit 0; fi
            git rebase --abort || true
            # 衝突時：以最新遠端為底，覆蓋本次產生的 site/ 與 data/
            OURS=$(git rev-parse HEAD)
            git reset -q --hard origin/main
            git checkout "$OURS" -- site data
            git commit -qm "更新資料" && git push && exit 0
          done
          exit 1
