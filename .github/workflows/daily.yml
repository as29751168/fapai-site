name: 每日更新法拍資料
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scrape.py
      - name: 有變動才提交
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || (git commit -m "更新資料" && git push)
